        ? `Writes app.json's ${platform} icon fields to point at assets/app-icon/${platform}/`
        : `Upload the "${primarySlot}" icon above first`;
      setBtn.addEventListener('click', async () => {
        try {
          const json = await api('POST', `/api/app-icon/${platform}/apply-app-json`);
          applyResult(json);
          showToast('ok', `${APP_ICON_PLATFORM_LABELS[platform]}: app.json updated`);
        } catch (err) {
          showToast('err', err.message);
        }
      });
      appJsonSection.appendChild(setBtn);

      if (platform !== 'web') {
        const nativeExists = appIconNativeStatus[platform];
        const syncBtn = document.createElement('button');
        syncBtn.type = 'button';
        syncBtn.textContent = `Sync to native ${platform === 'ios' ? 'ios/' : 'android/'} project`;
        syncBtn.style.marginLeft = '8px';
        syncBtn.disabled = !primarySlotPresent || !nativeExists;
        syncBtn.title = !nativeExists
          ? `No ${platform === 'ios' ? 'ios/' : 'android/'} directory found — run \`expo prebuild\` at least once first`
          : !primarySlotPresent
          ? `Upload the "${primarySlot}" icon above first`
          : platform === 'ios'
          ? 'Copies these files directly into Images.xcassets/AppIcon.appiconset (bypasses expo prebuild)'
          : 'Copies these files into a single Android density bucket (bypasses expo prebuild — see warnings after)';
        syncBtn.addEventListener('click', async () => {
          try {
            const json = await api('POST', `/api/app-icon/${platform}/sync-native`);
            applyResult(json);
            const syncWarnings = (json.nativeSync && json.nativeSync.warnings) || [];
            showToast('ok', `${APP_ICON_PLATFORM_LABELS[platform]}: synced to native project` + (syncWarnings.length ? ` — ${syncWarnings.join('; ')}` : ''));
          } catch (err) {
            showToast('err', err.message);
          }
        });
        appJsonSection.appendChild(syncBtn);
      }

      wrap.appendChild(appJsonSection);
      wrap.appendChild(document.createElement('hr')).className = 'divider';

      const deleteBtn = document.createElement('button');
      deleteBtn.className = 'danger';
      deleteBtn.type = 'button';
      deleteBtn.textContent = `Remove ${APP_ICON_PLATFORM_LABELS[platform]} Support`;
      deleteBtn.disabled = !configured;
      deleteBtn.title = configured
        ? `Delete assets/app-icon/${platform}/ entirely (undoable — Ctrl/Cmd+Z or the Undo button)`
        : `Nothing to remove — ${APP_ICON_PLATFORM_LABELS[platform]} isn't configured yet`;
      deleteBtn.addEventListener('click', async () => {
        if (!confirm(`Delete assets/app-icon/${platform}/? You can Undo this right after.`)) return;
        try {
          const json = await api('DELETE', `/api/app-icon/${platform}`);
          applyResult(json);
          showToast('ok', `${APP_ICON_PLATFORM_LABELS[platform]}: support removed (Ctrl/Cmd+Z to undo)`);
        } catch (err) {
          showToast('err', err.message);
        }
      });
      wrap.appendChild(deleteBtn);

      return wrap;
    }

    /** One slot row (e.g. iOS "tinted") — a small droppable swatch preview plus Add/Replace and
     * (when present) Remove controls, all wired straight to PUT/DELETE
     * /api/app-icon/:platform/:slot. Mirrors the image detail view's swatch conventions at a
     * smaller size, since a platform can have up to 3 of these stacked. */
    function renderAppIconSlotBlock(platform, slot, filename, help) {
      const block = document.createElement('div');
      block.className = 'field-block';
      const label = document.createElement('label');
      label.textContent = slot.charAt(0).toUpperCase() + slot.slice(1);
      block.appendChild(label);

      const row = document.createElement('div');
      row.className = 'row';
      row.style.alignItems = 'flex-start';

      const swatch = document.createElement('div');
      swatch.className = 'swatch light droppable';
      swatch.style.width = '96px';
      swatch.style.maxWidth = '96px';
      swatch.style.height = '96px';
      swatch.title = filename ? 'Drop a PNG here to replace it' : 'Drop a PNG here to add it';
      if (filename) {
        const img = document.createElement('img');
        img.src = appIconSrc(platform, filename);
        swatch.appendChild(img);
      } else {
        const placeholder = document.createElement('div');
        placeholder.className = 'thumb-placeholder';
        placeholder.style.width = '32px';
        placeholder.style.height = '32px';
        swatch.appendChild(placeholder);
      }
      row.appendChild(swatch);

      async function upload(file) {
        const image = await fileToBase64(file);
        const json = await api('PUT', `/api/app-icon/${platform}/${slot}`, { image });
        applyResult(json);
        showToast('ok', `${APP_ICON_PLATFORM_LABELS[platform]} ${slot}: ${filename ? 'replaced' : 'added'}`);
      }
      wireDropZone(swatch, async (files) => {
        try {
          await upload(files[0]);
        } catch (err) {
          showToast('err', err.message);
        }
      });

      const controls = document.createElement('div');
      controls.style.display = 'flex';
      controls.style.flexDirection = 'column';
      controls.style.gap = '6px';
      controls.appendChild(fileButton(filename ? 'Replace' : 'Add', `Upload the ${slot} image`, upload));
      if (filename) {
        const removeBtn = document.createElement('button');
        removeBtn.type = 'button';
        removeBtn.textContent = 'Remove';
        removeBtn.title = `Delete assets/app-icon/${platform}/${filename}`;
        removeBtn.addEventListener('click', async () => {
          try {
            const json = await api('DELETE', `/api/app-icon/${platform}/${slot}`);
            applyResult(json);
            showToast('ok', `${APP_ICON_PLATFORM_LABELS[platform]} ${slot}: removed`);
          } catch (err) {
            showToast('err', err.message);
          }
        });
        controls.appendChild(removeBtn);
      }
      row.appendChild(controls);
      block.appendChild(row);

      if (help) {
        const helpEl = document.createElement('div');
        helpEl.className = 'field-help';
        helpEl.textContent = help;
        block.appendChild(helpEl);
      }
      return block;
    }

    renderDetail();
    refresh();
  </script>
</body>
</html>
