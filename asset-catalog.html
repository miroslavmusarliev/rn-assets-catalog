<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Image Catalog</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  /*
   * The app's own chrome (panels/text/controls) follows system light/dark via
   * prefers-color-scheme below. --swatch-light/--swatch-dark are a SEPARATE axis — they always
   * stay light/dark respectively regardless of the tool's own theme, since they simulate how an
   * image renders in the *app being cataloged*'s light/dark mode, not this tool's UI.
   *
   * --tint-light/--tint-dark are fallback defaults only — asset-catalog-server.js always
   * overrides both via an injected <style> block reading the real
   * hooks/_assetCatalogColorPrimaryTint.js, so a 'template' image's preview shows its actual
   * configured tint (via CSS mask, see maskedImage() below), not a generic approximation.
   */
  :root {
    color-scheme: light dark;
    --bg: #f2f2f7;
    --panel: #ffffff;
    --panel-border: #d1d1d6;
    --text: #1c1c1e;
    --text-dim: #6e6e73;
    --accent: #ff3b30;
    --badge-bg: #ffe1df;
    --badge-text: #b0201a;
    --select: #0a84ff;
    --swatch-light: #f2f2f2;
    --swatch-dark: #202024;
    --tint-light: #000000;
    --tint-dark: #ffffff;
    --ok: #248a3d;
    --ok-bg: #e3f7e9;
    --err: #d70015;
    --err-bg: #ffe1df;
    --control-bg: #e5e5ea;
    --control-bg-hover: #d1d1d6;
    --control-border: #c7c7cc;
    --danger-hover-bg: #ffd6d3;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1c1e;
      --panel: #2c2c2e;
      --panel-border: #3a3a3c;
      --text: #f2f2f7;
      --text-dim: #9a9aa2;
      --badge-bg: #7a1f1a;
      --badge-text: #ffb4b0;
      --ok: #34c759;
      --ok-bg: rgba(52,199,89,0.15);
      --err: #ff453a;
      --err-bg: rgba(255,69,58,0.15);
      --control-bg: #3a3a3c;
      --control-bg-hover: #48484a;
      --control-border: #48484a;
      --danger-hover-bg: #7a1f1a;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  /* A 'template' image's real tint (--tint-light/--tint-dark, from the actual
     hooks/_assetCatalogColorPrimaryTint.js) applied via CSS mask — background-color and
     mask-image are set per-instance in JS (see maskedImage()), this just holds the shared sizing. */
  .masked-image {
    display: inline-block;
    -webkit-mask-size: contain;
    mask-size: contain;
    -webkit-mask-repeat: no-repeat;
    mask-repeat: no-repeat;
    -webkit-mask-position: center;
    mask-position: center;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 13px;
  }
  .app { display: flex; height: 100vh; }

  /* --- sidebar --- */
  .sidebar {
    width: 280px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    background: var(--panel);
    border-right: 1px solid var(--panel-border);
  }
  .sidebar-header {
    padding: 12px 14px;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 8px;
    border-bottom: 1px solid var(--panel-border);
  }
  .sidebar-title { font-weight: 600; font-size: 14px; }
  .sidebar-subtitle { color: var(--text-dim); font-size: 11px; margin-top: 2px; }
  /* Images/Colors switch — a segmented control in the same visual language as a selected
     .list-item (var(--select) fill, white text) rather than introducing a new selection color. */
  .tab-switch {
    display: flex;
    border: 1px solid var(--control-border);
    border-radius: 6px;
    overflow: hidden;
  }
  .tab-btn {
    flex: 1;
    font: inherit;
    font-weight: 600;
    font-size: 12px;
    background: var(--control-bg);
    color: var(--text);
    border: none;
    padding: 5px 12px;
    cursor: pointer;
  }
  .tab-btn + .tab-btn { border-left: 1px solid var(--control-border); }
  .tab-btn:hover { background: var(--control-bg-hover); }
  .tab-btn.active { background: var(--select); color: #fff; }
  #undoButton {
    flex-shrink: 0;
    font: inherit;
    font-weight: 600;
    background: var(--control-bg);
    color: var(--text);
    border: 1px solid var(--control-border);
    border-radius: 6px;
    padding: 5px 10px;
    cursor: pointer;
  }
  #undoButton:hover:not(:disabled) { background: var(--control-bg-hover); }
  #undoButton:disabled { opacity: 0.35; cursor: default; }
  .list { flex: 1; overflow-y: auto; padding: 6px 0; }
  .list.drag-over { outline: 2px dashed var(--select); outline-offset: -2px; background: var(--control-bg); }
  .list-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 5px 14px;
    cursor: pointer;
    white-space: nowrap;
  }
  .list-item:hover { background: var(--control-bg-hover); }
  .list-item.selected { background: var(--select); color: #fff; }
  .list-item img { width: 18px; height: 18px; object-fit: contain; flex-shrink: 0; }
  .list-item .masked-image { width: 18px; height: 18px; flex-shrink: 0; }
  .list-item .thumb-placeholder {
    width: 18px; height: 18px; flex-shrink: 0; border-radius: 4px;
    background: repeating-linear-gradient(45deg, var(--control-border), var(--control-border) 3px, transparent 3px, transparent 6px);
  }
  .list-item .color-swatch {
    width: 18px; height: 18px; flex-shrink: 0; border-radius: 4px;
    border: 1px solid var(--panel-border);
  }
  .list-item .name { overflow: hidden; text-overflow: ellipsis; flex: 1; }
  .list-item .mode-dot {
    width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0;
    background: var(--text-dim);
  }
  .list-item.selected .mode-dot { background: rgba(255,255,255,0.7); }
  .list-empty { color: var(--text-dim); font-size: 12px; padding: 10px 14px; }
  .sidebar-footer {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 8px;
    border-top: 1px solid var(--panel-border);
  }
  .image-btn {
    width: 22px; height: 22px;
    display: flex; align-items: center; justify-content: center;
    background: transparent;
    border: none;
    color: var(--text-dim);
    font-size: 16px;
    line-height: 1;
    cursor: pointer;
    border-radius: 4px;
  }
  .image-btn:hover { background: var(--control-bg-hover); color: var(--text); }
  .density-toggle {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 10px 8px;
    font-size: 11px;
    color: var(--text-dim);
    cursor: pointer;
    border-top: 1px solid var(--panel-border);
  }
  .density-toggle input { cursor: pointer; }
  #filterInput {
    flex: 1;
    font: inherit;
    background: var(--control-bg);
    color: var(--text);
    border: 1px solid var(--control-border);
    border-radius: 6px;
    padding: 4px 8px;
    font-size: 12px;
  }

  /* --- detail pane --- */
  .detail { flex: 1; overflow-y: auto; padding: 28px 36px; }
  .empty {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    color: var(--text-dim);
    text-align: center;
  }
  .empty .empty-title { font-size: 15px; color: var(--text); }
  .empty .empty-help { font-size: 12px; max-width: 360px; line-height: 1.6; }
  .empty .empty-help b { color: var(--text); }
  .empty .empty-help code { background: var(--control-bg); border-radius: 4px; padding: 1px 4px; }

  .detail-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 20px; }
  .detail-name { font-size: 18px; font-weight: 600; word-break: break-all; }
  .badge {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    padding: 3px 9px;
    border-radius: 999px;
    background: var(--badge-bg);
    color: var(--badge-text);
    white-space: nowrap;
    cursor: help;
  }
  .swatches { display: flex; gap: 16px; margin-bottom: 20px; }
  .swatch {
    flex: 1;
    max-width: 220px;
    border-radius: 10px;
    height: 140px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
    border: 1px solid var(--panel-border);
  }
  .swatch.light { background: var(--swatch-light); }
  .swatch.dark { background: var(--swatch-dark); }
  .swatch.droppable { cursor: copy; }
  .swatch.drag-over { outline: 2px dashed var(--select); outline-offset: -2px; }
  .swatch img { width: 56px; height: 56px; object-fit: contain; }
  .swatch .masked-image { width: 56px; height: 56px; }
  .swatch-label {
    position: absolute;
    bottom: 6px;
    left: 8px;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .swatch.light .swatch-label { color: #00000088; }
  .swatch.dark .swatch-label { color: #ffffff77; }
  .fallback-note { font-size: 10px; color: #ffffff55; position: absolute; top: 6px; right: 8px; }

  .field-block { margin-bottom: 18px; }
  .field-block label, .field-label { display: block; font-size: 11px; color: var(--text-dim); margin-bottom: 5px; }
  .field-help { font-size: 11px; color: var(--text-dim); opacity: 0.85; margin-top: 5px; line-height: 1.5; }
  .density-row { align-items: center; margin-bottom: 6px; }
  .density-row-title { font-size: 11px; color: var(--text-dim); min-width: 70px; }
  .density-badge {
    font-size: 10px;
    font-weight: 600;
    padding: 2px 6px;
    border-radius: 4px;
    background: var(--control-bg);
    color: var(--text-dim);
  }
  .density-badge.present { background: var(--ok-bg); color: var(--ok); }
  .density-variants { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .density-custom { display: inline-flex; align-items: center; gap: 6px; }
  .density-custom-input { width: 52px; padding: 7px 6px; text-align: center; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  select, button, input[type="text"] {
    font: inherit;
    background: var(--control-bg);
    color: var(--text);
    border: 1px solid var(--control-border);
    border-radius: 6px;
    padding: 7px 10px;
    font-size: 12px;
  }
  button { cursor: pointer; }
  button:hover:not(:disabled) { background: var(--control-bg-hover); }
  button:disabled { opacity: 0.35; cursor: default; }
  button.danger { color: var(--err); }
  button.danger:hover:not(:disabled) { background: var(--danger-hover-bg); }
  label.file-btn { display: inline-flex; }
  label.file-btn input { display: none; }
  .create-btn { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .create-btn:hover:not(:disabled) { background: #ff5147; }
  .create-btn:disabled { background: var(--control-bg); border-color: var(--control-border); color: var(--text-dim); }
  .divider { border: none; border-top: 1px solid var(--panel-border); margin: 22px 0; }

  .toast {
    position: fixed;
    left: 296px;
    right: 16px;
    bottom: 16px;
    font-size: 12px;
    border-radius: 8px;
    padding: 9px 14px;
    display: none;
    white-space: pre-wrap;
  }
  .toast.ok { display: block; background: var(--ok-bg); color: var(--ok); border: 1px solid var(--ok); }
  .toast.err { display: block; background: var(--err-bg); color: var(--err); border: 1px solid var(--err); }
</style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="sidebar-header">
        <div>
          <div id="tabSwitch" class="tab-switch">
            <button type="button" class="tab-btn active" data-tab="images">Images</button>
            <button type="button" class="tab-btn" data-tab="colors">Colors</button>
            <button type="button" class="tab-btn" data-tab="app">App</button>
          </div>
          <div id="sidebarSubtitle" class="sidebar-subtitle">assets/images/</div>
        </div>
        <button id="undoButton" type="button" title="Ctrl/Cmd+Z">Undo</button>
      </div>
      <div id="list" class="list"></div>
      <div class="sidebar-footer">
        <button id="addButton" class="image-btn" type="button" title="New image">+</button>
        <input id="filterInput" type="text" placeholder="Filter" />
      </div>
      <label class="density-toggle" title="Purely visual — hides/shows @2x/@3x/etc. controls in the detail view, doesn't change any image on disk">
        <input id="densityToggle" type="checkbox" />
        Show density variants
      </label>
    </aside>
    <main id="detail" class="detail"></main>
  </div>
  <div id="toast" class="toast"></div>

  <script>
    const listEl = document.getElementById('list');
    const detailEl = document.getElementById('detail');
    const toastEl = document.getElementById('toast');
    const undoButton = document.getElementById('undoButton');
    const addButton = document.getElementById('addButton');
    const filterInput = document.getElementById('filterInput');
    const tabButtons = Array.from(document.querySelectorAll('#tabSwitch .tab-btn'));
    const sidebarSubtitleEl = document.getElementById('sidebarSubtitle');
    const densityToggle = document.getElementById('densityToggle');

    let entries = []; // images
    let colorEntries = [];
    let appIconPlatforms = {}; // { ios?: { slots: {...} }, android?: {...}, web?: {...} } — a
                                 // platform key is absent entirely when that platform isn't configured
    let appIconNativeStatus = { ios: false, android: false }; // whether ios//android/ actually exist
                                 // on disk right now — drives whether "sync to native project" has
                                 // anywhere to write into yet (web has no native project at all)
    let undoCount = 0;
    let nextUndoLabel = null;
    let activeTab = 'images'; // 'images' | 'colors' | 'app' — which catalog the sidebar/detail pane shows
    let selectedImage = null; // an image name, 'NEW', or null (nothing selected) — kept independent
    let selectedColor = null; // of selectedImage/selectedAppIconPlatform so switching tabs never
    let selectedAppIconPlatform = null; // loses any of the three tabs' own selection
    let filterText = '';

    // The app icon is a single, fixed-shape catalog entry (not a named collection) — exactly these
    // three platform keys, in this display order, each with its own fixed slot set and per-slot
    // help text reflecting that platform's real icon requirements.
    const APP_ICON_PLATFORM_ORDER = ['ios', 'android', 'web'];
    const APP_ICON_PLATFORM_LABELS = { ios: 'iOS', android: 'Android', web: 'Web' };
    const APP_ICON_SLOT_INFO = {
      ios: {
        slots: ['light', 'dark', 'tinted'],
        help: {
          light: 'Required — the standard iOS app icon. Maps to app.json\'s ios.icon.light.',
          dark: 'Optional — shown when the device is in Dark Mode (iOS 18+). Maps to ios.icon.dark.',
          tinted: 'Optional — a grayscale mask iOS can tint to the user\'s chosen accent color (iOS 18+ tinted icons). Maps to ios.icon.tinted.',
        },
      },
      android: {
        slots: ['foreground', 'background', 'monochrome'],
        help: {
          foreground: 'Required — the adaptive icon\'s foreground layer. Maps to android.adaptiveIcon.foregroundImage.',
          background: 'Required — the adaptive icon\'s background layer. Maps to android.adaptiveIcon.backgroundImage.',
          monochrome: 'Optional — a single-color layer used for Android 13+ themed icons. Maps to android.adaptiveIcon.monochromeImage.',
        },
      },
      web: {
        slots: ['favicon'],
        help: { favicon: 'The browser tab icon for the web build. Maps to web.favicon.' },
      },
    };

    // Global, purely-visual toggle for the density-variant controls (@1.5x/@2x/@3x/@4x/custom) in
    // the image detail view — hides clutter for the common case of an image with just a base image,
    // never affects what's on disk. In-memory only (not per-image, no persistence) — resets to
    // hidden on every page load.
    let showDensityVariants = false;
    densityToggle.checked = showDensityVariants;
    densityToggle.addEventListener('change', () => {
      showDensityVariants = densityToggle.checked;
      renderDetail();
    });

    function getSelected() {
      if (activeTab === 'images') return selectedImage;
      if (activeTab === 'colors') return selectedColor;
      return selectedAppIconPlatform;
    }
    function setSelected(value) {
      if (activeTab === 'images') selectedImage = value;
      else if (activeTab === 'colors') selectedColor = value;
      else selectedAppIconPlatform = value;
    }

    // Sidebar thumbnails preview each image the way it'd actually render right now on this
    // system — live, not just at page load, so flipping OS appearance while the tool is open
    // updates them immediately.
    const darkModeQuery = window.matchMedia('(prefers-color-scheme: dark)');
    let systemDark = darkModeQuery.matches;
    darkModeQuery.addEventListener('change', (e) => {
      systemDark = e.matches;
      renderList();
    });

    function showToast(kind, message) {
      toastEl.className = 'toast ' + kind;
      toastEl.textContent = message;
    }
    function clearToast() {
      toastEl.className = 'toast';
      toastEl.textContent = '';
    }

    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(String(reader.result).split(',')[1] || '');
        reader.onerror = () => reject(reader.error);
        reader.readAsDataURL(file);
      });
    }

    function dragCarriesFiles(e) {
      return Boolean(e.dataTransfer) && Array.from(e.dataTransfer.types || []).includes('Files');
    }

    /** Wires the standard 4-event drag-and-drop dance onto `el`, using an enter/leave counter so
     * a child element (an <img>, a label) moving under the pointer doesn't flicker the
     * 'drag-over' highlight on and off. `onFiles` only fires for a real file drop. `isEnabled()`
     * (defaults to always-on) gates the whole thing — while it returns false, drag events are
     * left completely alone (no highlight, no preventDefault), e.g. so the image organiser's own
     * drop zone no-ops while the Colors tab is active instead of drawing a misleading drag-over
     * outline for a catalog that has no file-drop input at all. */
    function wireDropZone(el, onFiles, isEnabled = () => true) {
      let depth = 0;
      el.addEventListener('dragenter', (e) => {
        if (!isEnabled() || !dragCarriesFiles(e)) return;
        e.preventDefault();
        depth++;
        el.classList.add('drag-over');
      });
      el.addEventListener('dragover', (e) => {
        if (!isEnabled() || !dragCarriesFiles(e)) return;
        e.preventDefault();
        e.dataTransfer.dropEffect = 'copy';
      });
      el.addEventListener('dragleave', () => {
        if (!isEnabled()) return;
        depth = Math.max(0, depth - 1);
        if (depth === 0) el.classList.remove('drag-over');
      });
      el.addEventListener('drop', (e) => {
        if (!isEnabled() || !dragCarriesFiles(e)) return;
        e.preventDefault();
        depth = 0;
        el.classList.remove('drag-over');
        const files = Array.from(e.dataTransfer.files || []).filter((f) => f.type === 'image/png');
        if (files.length === 0) {
          showToast('err', 'Only PNG files are supported');
          return;
        }
        onFiles(files);
      });
    }

    function slugify(str) {
      const slug = str.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
      return slug || 'new-image';
    }

    function nameFromFilename(filename) {
      return slugify(filename.replace(/\.[^./]+$/, ''));
    }

    /** Parses a dropped filename into { base, group, density } — recognizes the standard @2x/@3x
     * density suffix and a few common dark-variant suffix spellings (-dark, _dark, @dark, case
     * insensitive), so a batch like bill.png/bill@2x.png/bill@3x.png/bill-dark.png dropped
     * together groups into ONE image instead of four separate ones. */
    function parseDroppedFilename(filename) {
      let rest = filename.replace(/\.[^./]+$/, '');
      let density = '1';
      // Any positive number, not just 2/3 — matches Metro's own configurable
      // resolver.assetResolutions (see lib/asset-catalog-core.js's module comment) rather than
      // hardcoding the common 2x/3x case.
      const densityMatch = rest.match(/@([0-9]+(?:\.[0-9]+)?)x$/i);
      if (densityMatch) {
        density = densityMatch[1];
        rest = rest.slice(0, densityMatch.index);
      }
      let group = 'light';
      const darkMatch = rest.match(/[-_@]dark$/i);
      if (darkMatch) {
        group = 'dark';
        rest = rest.slice(0, darkMatch.index);
      }
      return { base: slugify(rest), group, density };
    }

    /** Groups a drop's files by their parsed base name into { base -> { <slot>: File } } (e.g.
     * "light", "light@2x", "dark@1.5x") — the same slot keys the create API expects. */
    function groupDroppedFiles(files) {
      const groups = new Map();
      for (const file of files) {
        const { base, group, density } = parseDroppedFilename(file.name);
        const slot = densitySlot(group, density);
        if (!groups.has(base)) groups.set(base, {});
        groups.get(base)[slot] = file;
      }
      return groups;
    }

    function uniqueName(base) {
      if (!entries.some((e) => e.name === base)) return base;
      let i = 2;
      while (entries.some((e) => e.name === `${base}-${i}`)) i++;
      return `${base}-${i}`;
    }

    async function api(method, path, body) {
      const res = await fetch(path, {
        method,
        headers: body ? { 'Content-Type': 'application/json' } : undefined,
        body: body ? JSON.stringify(body) : undefined,
      });
      const json = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(json.error || `request failed (${res.status})`);
      return json;
    }

    // GET /api/images and GET /api/colors both return the SAME combined { entries, warnings,
    // colorEntries, colorWarnings, undoCount, nextUndoLabel } payload — every mutation to either
    // catalog returns it too, so one applyResult() keeps both lists (and the shared undo state)
    // current under the hood no matter which catalog a request actually touched; only the
    // currently-active tab's list/detail re-renders.
    function applyResult(json) {
      entries = json.entries;
      colorEntries = json.colorEntries || [];
      appIconPlatforms = json.appIconPlatforms || {};
      appIconNativeStatus = json.appIconNativeStatus || { ios: false, android: false };
      undoCount = json.undoCount || 0;
      nextUndoLabel = json.nextUndoLabel || null;
      undoButton.disabled = undoCount === 0;
      undoButton.title = nextUndoLabel ? `Undo: ${nextUndoLabel} (Ctrl/Cmd+Z)` : 'Nothing to undo';
      // If the selected entry no longer exists (e.g. it was deleted, or its create was undone),
      // fall back to no selection rather than showing a detail view for a ghost entry — checked
      // independently for each catalog's own selection.
      if (typeof selectedImage === 'string' && selectedImage !== 'NEW' && !entries.some((e) => e.name === selectedImage)) {
        selectedImage = null;
      }
      if (typeof selectedColor === 'string' && selectedColor !== 'NEW' && !colorEntries.some((e) => e.name === selectedColor)) {
        selectedColor = null;
      }
      renderList();
      renderDetail();
    }

    async function refresh() {
      try {
        const json = await api('GET', '/api/images');
        applyResult(json);
        const warnings = [...(json.warnings || []), ...(json.colorWarnings || []), ...(json.appIconWarnings || [])];
        if (warnings.length) showToast('ok', warnings.join('; '));
        else clearToast();
      } catch (err) {
        showToast('err', err.message);
      }
    }

    undoButton.addEventListener('click', async () => {
      if (undoButton.disabled) return;
      try {
        const json = await api('POST', '/api/undo');
        applyResult(json);
        showToast('ok', `undone: ${json.undone}`);
      } catch (err) {
        showToast('err', err.message);
      }
    });

    addButton.addEventListener('click', () => {
      setSelected('NEW');
      renderList();
      renderDetail();
    });

    filterInput.addEventListener('input', () => {
      filterText = filterInput.value.trim().toLowerCase();
      renderList();
    });

    // Images/Colors tab switch — swaps which catalog the sidebar list and detail pane show. Both
    // catalogs are always kept current under the hood (see applyResult()), so switching tabs
    // never shows stale data even if the other catalog was mutated while it wasn't visible.
    for (const btn of tabButtons) {
      btn.addEventListener('click', () => {
        if (btn.dataset.tab === activeTab) return;
        activeTab = btn.dataset.tab;
        for (const b of tabButtons) b.classList.toggle('active', b === btn);
        sidebarSubtitleEl.textContent =
          activeTab === 'images' ? 'assets/images/' : activeTab === 'colors' ? 'assets/colors/' : 'assets/app-icon/';
        addButton.title = activeTab === 'images' ? 'New image' : 'New color';
        // The app icon is a fixed set of 3 platforms, not a user-creatable/filterable named
        // collection — hide the "new entry" and filter controls entirely while its tab is active.
        addButton.style.display = activeTab === 'app' ? 'none' : '';
        filterInput.style.display = activeTab === 'app' ? 'none' : '';
        filterInput.value = '';
        filterText = '';
        renderList();
        renderDetail();
      });
    }

    // Dropping file(s) anywhere on the sidebar list ("the organiser") creates a new image per
    // *group* of files, named after the group's base filename — a same-batch set like
    // bill.png/bill@2x.png/bill@3x.png/bill-dark.png groups into ONE image (light+densities+dark),
    // not four separate ones, mirroring Xcode's "drag onto the asset navigator" behavior. Mode is
    // inferred the same way generate-asset-catalog.js infers a missing config.json: a dark file in
    // the group means 'original', otherwise 'template'. Wired once here (not inside renderList())
    // since #list's own container node is stable across re-renders — only its contents change.
    wireDropZone(listEl, async (files) => {
      const groups = groupDroppedFiles(files);
      let lastName = null;
      let created = 0;
      for (const [base, slotFiles] of groups) {
        const slotKeys = Object.keys(slotFiles);
        if (!slotKeys.some((slot) => slot === 'light' || slot.startsWith('light@'))) {
          showToast('err', `${base}: no light-appearance image found in this drop`);
          continue;
        }
        const name = uniqueName(base);
        try {
          const hasDark = slotKeys.some((slot) => slot === 'dark' || slot.startsWith('dark@'));
          const body = { name, mode: hasDark ? 'original' : 'template' };
          for (const slot of slotKeys) {
            body[slot] = await fileToBase64(slotFiles[slot]);
          }
          const json = await api('POST', '/api/images', body);
          applyResult(json);
          lastName = name;
          created++;
        } catch (err) {
          showToast('err', `${base}: ${err.message}`);
        }
      }
      if (lastName) {
        selectedImage = lastName;
        renderList();
        renderDetail();
        showToast('ok', created > 1 ? `created ${created} images` : `${lastName}: created`);
      }
    }, () => activeTab === 'images');

    document.addEventListener('keydown', (e) => {
      const isUndoChord = (e.metaKey || e.ctrlKey) && !e.shiftKey && e.key.toLowerCase() === 'z';
      if (isUndoChord) {
        e.preventDefault();
        undoButton.click();
      }
    });

    // Preview purposes only (this editor, unlike Metro at runtime, has no device pixel ratio to
    // resolve against — it just needs one real file to point an <img> at). NEVER assume the bare
    // 1x file exists: an image can be 2x/3x-only (see lib/asset-catalog-core.js's resolvePrimarySlot
    // doc comment), so every preview call site below uses entry.lightSource/entry.darkSource — the
    // server's own already-resolved "which file actually backs this appearance" answer — instead
    // of recomputing a bare filename that might not be on disk.
    function imgSrcForFile(name, filename) {
      return `/image-src/${encodeURIComponent(name)}/${filename}?t=${Date.now()}`;
    }

    /** Mirrors useImage's own resolution rule for a given entry, picking ONE rendering for
     * whichever theme `dark` says — the sidebar thumbnail shows "how this actually looks right
     * now", unlike the detail pane's deliberate side-by-side light+dark comparison. */
    function previewFor(entry, dark) {
      if (entry.mode === 'template') {
        return { src: imgSrcForFile(entry.name, entry.lightSource), tinted: true, dark };
      }
      if (dark && entry.hasDark) return { src: imgSrcForFile(entry.name, entry.darkSource), tinted: false };
      return { src: imgSrcForFile(entry.name, entry.lightSource), tinted: false };
    }

    /** Renders a 'template' image's real configured tint via a CSS mask (the source PNG as the
     * mask shape, a solid background-color underneath) instead of an approximated invert
     * filter — `varCssColor` is one of the --tint-light/--tint-dark custom properties
     * asset-catalog-server.js injects from the actual hooks/_assetCatalogColorPrimaryTint.js. */
    function maskedImage(src, varCssColor) {
      const el = document.createElement('div');
      el.className = 'masked-image';
      el.style.backgroundColor = varCssColor;
      el.style.webkitMaskImage = `url("${src}")`;
      el.style.maskImage = `url("${src}")`;
      return el;
    }

    // ---------- sidebar list ----------

    function renderList() {
      listEl.innerHTML = '';
      if (activeTab === 'images') renderImageListItems();
      else if (activeTab === 'colors') renderColorListItems();
      else renderAppIconListItems();
    }

    /** The app-icon "list" is always exactly these 3 fixed rows (iOS/Android/Web) — never
     * filtered, never user-creatable/deletable by name (only a platform's own folder, from inside
     * its detail view). A green dot marks a platform that currently has an assets/app-icon/<platform>/
     * folder at all; an unconfigured platform is still clickable — selecting it shows empty slots
     * ready to accept an upload, which is what actually creates its folder. */
    function renderAppIconListItems() {
      for (const platform of APP_ICON_PLATFORM_ORDER) {
        const configured = Boolean(appIconPlatforms[platform]);
        const row = document.createElement('div');
        row.className = 'list-item' + (selectedAppIconPlatform === platform ? ' selected' : '');
        row.title = configured
          ? `assets/app-icon/${platform}/`
          : `Not configured yet — click to set up ${APP_ICON_PLATFORM_LABELS[platform]}`;

        const dot = document.createElement('div');
        dot.className = 'mode-dot';
        if (configured) dot.style.background = 'var(--ok)';
        row.appendChild(dot);

        const name = document.createElement('div');
        name.className = 'name';
        name.textContent = APP_ICON_PLATFORM_LABELS[platform] + (configured ? '' : ' (not configured)');
        row.appendChild(name);

        row.addEventListener('click', () => {
          selectedAppIconPlatform = platform;
          renderList();
          renderDetail();
        });
        listEl.appendChild(row);
      }
    }

    function renderImageListItems() {
      const visible = filterText
        ? entries.filter((e) => e.name.toLowerCase().includes(filterText))
        : entries;

      if (visible.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'list-empty';
        empty.textContent = entries.length === 0 ? 'No images yet — click + to add one.' : 'No images match this filter.';
        listEl.appendChild(empty);
      }

      for (const entry of visible) {
        const row = document.createElement('div');
        row.className = 'list-item' + (selectedImage === entry.name ? ' selected' : '');
        row.title = entry.mode === 'template' ? 'template — tinted at runtime' : 'original — non-tintable art';

        const preview = previewFor(entry, systemDark);
        if (preview.tinted) {
          // A per-image tint override (entry.tint) wins over the app-wide --tint-light/--tint-dark
          // fallback, same rule maskedImage() follows in the detail pane's swatches.
          const tintColor = entry.tint
            ? (preview.dark ? entry.tint.dark : entry.tint.light)
            : (preview.dark ? 'var(--tint-dark)' : 'var(--tint-light)');
          row.appendChild(maskedImage(preview.src, tintColor));
        } else {
          const img = document.createElement('img');
          img.src = preview.src;
          row.appendChild(img);
        }

        const name = document.createElement('div');
        name.className = 'name';
        name.textContent = entry.name;
        row.appendChild(name);

        row.addEventListener('click', () => {
          selectedImage = entry.name;
          renderList();
          renderDetail();
        });
        listEl.appendChild(row);
      }

      if (selectedImage === 'NEW') {
        const row = document.createElement('div');
        row.className = 'list-item selected';
        const placeholder = document.createElement('div');
        placeholder.className = 'thumb-placeholder';
        row.appendChild(placeholder);
        const name = document.createElement('div');
        name.className = 'name';
        name.textContent = 'New Image';
        row.appendChild(name);
        listEl.appendChild(row);
      }
    }

    function renderColorListItems() {
      const visible = filterText
        ? colorEntries.filter((e) => e.name.toLowerCase().includes(filterText))
        : colorEntries;

      if (visible.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'list-empty';
        empty.textContent = colorEntries.length === 0 ? 'No colors yet — click + to add one.' : 'No colors match this filter.';
        listEl.appendChild(empty);
      }

      for (const entry of visible) {
        const row = document.createElement('div');
        row.className = 'list-item' + (selectedColor === entry.name ? ' selected' : '');
        row.title = entry.name;

        const swatch = document.createElement('div');
        swatch.className = 'color-swatch';
        swatch.style.background = entry.light;
        row.appendChild(swatch);

        const name = document.createElement('div');
        name.className = 'name';
        name.textContent = entry.name;
        row.appendChild(name);

        row.addEventListener('click', () => {
          selectedColor = entry.name;
          renderList();
          renderDetail();
        });
        listEl.appendChild(row);
      }

      if (selectedColor === 'NEW') {
        const row = document.createElement('div');
        row.className = 'list-item selected';
        const placeholder = document.createElement('div');
        placeholder.className = 'thumb-placeholder';
        row.appendChild(placeholder);
        const name = document.createElement('div');
        name.className = 'name';
        name.textContent = 'New Color';
        row.appendChild(name);
        listEl.appendChild(row);
      }
    }

    // ---------- detail pane ----------

    function renderDetail() {
      detailEl.innerHTML = '';
      if (activeTab === 'images') {
        if (selectedImage === 'NEW') {
          detailEl.appendChild(renderNewDetail());
          return;
        }
        const entry = entries.find((e) => e.name === selectedImage);
        if (!entry) {
          detailEl.appendChild(renderEmptyDetail());
          return;
        }
        detailEl.appendChild(renderEntryDetail(entry));
        return;
      }
      if (activeTab === 'colors') {
        if (selectedColor === 'NEW') {
          detailEl.appendChild(renderNewColorDetail());
          return;
        }
        const colorEntry = colorEntries.find((e) => e.name === selectedColor);
        if (!colorEntry) {
          detailEl.appendChild(renderEmptyDetail());
          return;
        }
        detailEl.appendChild(renderColorDetail(colorEntry));
        return;
      }
      if (!selectedAppIconPlatform) {
        detailEl.appendChild(renderEmptyDetail());
        return;
      }
      detailEl.appendChild(renderAppIconPlatformDetail(selectedAppIconPlatform));
    }

    function renderEmptyDetail() {
      const wrap = document.createElement('div');
      wrap.className = 'empty';
      const title = document.createElement('div');
      title.className = 'empty-title';
      title.textContent = 'No Selection';
      const help = document.createElement('div');
      help.className = 'empty-help';
      help.innerHTML = activeTab === 'images'
        ? 'Choose an image on the left, or click <b>+</b> to add one.<br><br>' +
          '<b>Everything here is live</b> — there is no Save button. Every change writes to ' +
          '<code>assets/images/</code> immediately and regenerates ' +
          '<code>assets/image-catalog.generated.ts</code>. Made a mistake? Press ' +
          '<b>Ctrl/Cmd+Z</b> or the <b>Undo</b> button above to revert the most recent change ' +
          '(undo history lasts only for this run of the tool).'
        : activeTab === 'colors'
        ? 'Choose a color on the left, or click <b>+</b> to add one.<br><br>' +
          '<b>Everything here is live</b> — there is no Save button. Every change writes to ' +
          '<code>assets/colors/</code> immediately and regenerates ' +
          '<code>assets/color-catalog.generated.ts</code>. Made a mistake? Press ' +
          '<b>Ctrl/Cmd+Z</b> or the <b>Undo</b> button above to revert the most recent change ' +
          '(undo history lasts only for this run of the tool).'
        : 'Choose a platform on the left — iOS, Android, or Web.<br><br>' +
          '<b>Everything here is live</b> — there is no Save button. Every change writes to ' +
          '<code>assets/app-icon/</code> immediately. Unlike Images/Colors, there\'s nothing to ' +
          'regenerate — app.json references these files directly by path. A platform can be left ' +
          'partially empty (e.g. iOS with no tinted variant) or removed entirely if this app ' +
          'doesn\'t ship on it. Made a mistake? Press <b>Ctrl/Cmd+Z</b> or the <b>Undo</b> button ' +
          'above to revert the most recent change (undo history lasts only for this run of the tool).';
      wrap.append(title, help);
      return wrap;
    }

    function renderEntryDetail(entry) {
      const wrap = document.createElement('div');

      const header = document.createElement('div');
      header.className = 'detail-header';
      const nameEl = document.createElement('div');
      nameEl.className = 'detail-name';
      nameEl.textContent = entry.name;
      const badge = document.createElement('div');
      badge.className = 'badge';
      badge.textContent = entry.mode;
      badge.title = entry.mode === 'template'
        ? 'Template: a single-color mask. The app tints it at runtime via hooks/_assetCatalogColorPrimaryTint.js.'
        : 'Original: non-tintable multi-color art (e.g. a logo), rendered as-is.';
      header.append(nameEl, badge);
      wrap.appendChild(header);

      const swatches = document.createElement('div');
      swatches.className = 'swatches';

      const lightSwatch = document.createElement('div');
      lightSwatch.className = 'swatch light droppable';
      lightSwatch.title = 'How this image renders in light mode — drop a PNG here to replace it';
      if (entry.mode === 'template') {
        // A per-image tint override (entry.tint) wins over the app-wide --tint-light fallback.
        lightSwatch.appendChild(maskedImage(imgSrcForFile(entry.name, entry.lightSource), entry.tint ? entry.tint.light : 'var(--tint-light)'));
      } else {
        const lightImg = document.createElement('img');
        lightImg.src = imgSrcForFile(entry.name, entry.lightSource);
        lightSwatch.appendChild(lightImg);
      }
      const lightLabel = document.createElement('div');
      lightLabel.className = 'swatch-label';
      lightLabel.textContent = 'light';
      lightSwatch.appendChild(lightLabel);
      swatches.appendChild(lightSwatch);
      wireDropZone(lightSwatch, async (files) => {
        try {
          const light = await fileToBase64(files[0]);
          const json = await api('PUT', `/api/images/${encodeURIComponent(entry.name)}`, { light });
          applyResult(json);
          showToast('ok', `${entry.name}: light image replaced`);
        } catch (err) {
          showToast('err', err.message);
        }
      });

      const darkSwatch = document.createElement('div');
      darkSwatch.className = 'swatch dark';
      if (entry.hasDark) {
        darkSwatch.title = 'Dedicated dark-mode asset';
        const darkImg = document.createElement('img');
        darkImg.src = imgSrcForFile(entry.name, entry.darkSource);
        darkSwatch.appendChild(darkImg);
      } else if (entry.mode === 'template') {
        darkSwatch.title = 'No dark-mode asset needed — tinting handles dark mode, via the real hooks/_assetCatalogColorPrimaryTint.js color for \'dark\'.';
        // Same per-image override rule as the light swatch above.
        darkSwatch.appendChild(maskedImage(imgSrcForFile(entry.name, entry.lightSource), entry.tint ? entry.tint.dark : 'var(--tint-dark)'));
      } else {
        darkSwatch.title = 'No dark-mode asset yet — the app falls back to the light image in dark mode too.';
        const darkImg = document.createElement('img');
        darkImg.src = imgSrcForFile(entry.name, entry.lightSource);
        darkSwatch.appendChild(darkImg);
        const note = document.createElement('div');
        note.className = 'fallback-note';
        note.textContent = 'no dark asset';
        darkSwatch.appendChild(note);
      }
      const darkLabel = document.createElement('div');
      darkLabel.className = 'swatch-label';
      darkLabel.textContent = 'dark';
      darkSwatch.appendChild(darkLabel);
      swatches.appendChild(darkSwatch);
      // Template images don't hold a real dark-mode asset (tinting covers dark mode) — only an
      // 'original' image's dark swatch is a real, droppable slot.
      if (entry.mode === 'original') {
        darkSwatch.classList.add('droppable');
        darkSwatch.title += ' — drop a PNG here to ' + (entry.hasDark ? 'replace it' : 'add one');
        wireDropZone(darkSwatch, async (files) => {
          try {
            const dark = await fileToBase64(files[0]);
            const json = await api('PUT', `/api/images/${encodeURIComponent(entry.name)}`, { dark });
            applyResult(json);
            showToast('ok', `${entry.name}: dark image ${entry.hasDark ? 'replaced' : 'added'}`);
          } catch (err) {
            showToast('err', err.message);
          }
        });
      }

      wrap.appendChild(swatches);

      const modeBlock = document.createElement('div');
      modeBlock.className = 'field-block';
      const modeLabel = document.createElement('label');
      modeLabel.textContent = 'Rendering mode';
      const modeSelect = document.createElement('select');
      modeSelect.title = 'Switch how this image is rendered — applies immediately';
      for (const m of ['template', 'original']) {
        const opt = document.createElement('option');
        opt.value = m;
        opt.textContent = m;
        opt.selected = m === entry.mode;
        modeSelect.appendChild(opt);
      }
      modeSelect.addEventListener('change', async () => {
        try {
          const json = await api('PUT', `/api/images/${encodeURIComponent(entry.name)}`, { mode: modeSelect.value });
          applyResult(json);
          showToast('ok', `${entry.name}: mode set to ${modeSelect.value}`);
        } catch (err) {
          showToast('err', err.message);
        }
      });
      const modeHelp = document.createElement('div');
      modeHelp.className = 'field-help';
      modeHelp.textContent = 'template = single-color tintable glyph. original = non-tintable multi-color art (e.g. a logo).';
      modeBlock.append(modeLabel, modeSelect, modeHelp);
      wrap.appendChild(modeBlock);

      if (entry.mode === 'template') {
        wrap.appendChild(renderTintBlock(entry));
      }

      const densityBlock = document.createElement('div');
      densityBlock.className = 'field-block';
      const densityLabel = document.createElement('label');
      densityLabel.textContent = 'Light appearance';
      densityBlock.appendChild(densityLabel);
      densityBlock.appendChild(densityRow(entry, 'light'));
      const lightHelp = document.createElement('div');
      lightHelp.className = 'field-help';
      lightHelp.textContent = 'Needs at least one density — Metro picks whichever exist up automatically via its own require() density resolution, no code changes needed.';
      densityBlock.appendChild(lightHelp);

      const darkGroupLabel = document.createElement('label');
      darkGroupLabel.textContent = 'Dark appearance';
      darkGroupLabel.style.marginTop = '10px';
      densityBlock.appendChild(darkGroupLabel);
      densityBlock.appendChild(densityRow(entry, 'dark'));
      const darkHelp = document.createElement('div');
      darkHelp.className = 'field-help';
      darkHelp.textContent = entry.hasDark
        ? 'Fully optional as a whole — can be removed down to nothing, which just means dark mode falls back to the light appearance.'
        : 'Fully optional — add a density above to give this image a real dark-mode appearance instead of reusing its light image.';
      densityBlock.appendChild(darkHelp);
      wrap.appendChild(densityBlock);

      wrap.appendChild(document.createElement('hr')).className = 'divider';

      const deleteBtn = document.createElement('button');
      deleteBtn.className = 'danger';
      deleteBtn.type = 'button';
      deleteBtn.textContent = 'Delete Image';
      deleteBtn.title = 'Remove this entire image entry (undoable — Ctrl/Cmd+Z or the Undo button)';
      deleteBtn.addEventListener('click', async () => {
        if (!confirm(`Delete assets/images/${entry.name}/? You can Undo this right after.`)) return;
        try {
          const json = await api('DELETE', `/api/images/${encodeURIComponent(entry.name)}`);
          selectedImage = null;
          applyResult(json);
          showToast('ok', `${entry.name}: deleted (Ctrl/Cmd+Z to undo)`);
        } catch (err) {
          showToast('err', err.message);
        }
      });
      wrap.appendChild(deleteBtn);

      return wrap;
    }

    /** A small inline `<label>Text <input type=color></label>` pair — used for the two color
     * pickers a tint override or a color entry's dark override need side by side. */
    function labeledColorInput(labelText, value) {
      const wrap = document.createElement('label');
      wrap.style.display = 'inline-flex';
      wrap.style.alignItems = 'center';
      wrap.style.gap = '6px';
      wrap.style.fontSize = '11px';
      wrap.style.color = 'var(--text-dim)';
      const span = document.createElement('span');
      span.textContent = labelText;
      const input = document.createElement('input');
      input.type = 'color';
      input.value = value;
      wrap.append(span, input);
      return { wrap, input };
    }

    /** Per-image tint override control — only ever mounted for a 'template'-mode image (the server
     * itself rejects a "tint" field for 'original', which is never tinted at all). "Default" means
     * no override (the image defers to hooks/_assetCatalogColorPrimaryTint.js, entry.tint absent);
     * "Custom" reveals Light/Dark pickers bound to entry.tint, defaulting to black/white the first
     * time an image switches away from Default. Every change is live, same as every other control
     * on this page — PUT /api/images/:name with `tint: "default"` or `tint: { light, dark }`. */
    function renderTintBlock(entry) {
      const tintBlock = document.createElement('div');
      tintBlock.className = 'field-block';
      const tintLabel = document.createElement('label');
      tintLabel.textContent = 'Tint override';

      const tintToggle = document.createElement('select');
      tintToggle.title = 'Switch this image\'s tint between the app-wide default and a custom pair — applies immediately';
      for (const [value, label] of [['default', 'Default'], ['custom', 'Custom']]) {
        const opt = document.createElement('option');
        opt.value = value;
        opt.textContent = label;
        tintToggle.appendChild(opt);
      }
      const hasTint = Boolean(entry.tint);
      tintToggle.value = hasTint ? 'custom' : 'default';

      const pickerRow = document.createElement('div');
      pickerRow.className = 'row';
      pickerRow.style.display = hasTint ? '' : 'none';
      const lightPicker = labeledColorInput('Light', entry.tint ? entry.tint.light : '#000000');
      const darkPicker = labeledColorInput('Dark', entry.tint ? entry.tint.dark : '#ffffff');
      pickerRow.append(lightPicker.wrap, darkPicker.wrap);

      async function sendTint(tintValue, message) {
        try {
          const json = await api('PUT', `/api/images/${encodeURIComponent(entry.name)}`, { tint: tintValue });
          applyResult(json);
          showToast('ok', `${entry.name}: ${message}`);
        } catch (err) {
          showToast('err', err.message);
        }
      }

      tintToggle.addEventListener('change', () => {
        if (tintToggle.value === 'default') {
          pickerRow.style.display = 'none';
          sendTint('default', 'tint reset to default');
        } else {
          pickerRow.style.display = '';
          sendTint({ light: lightPicker.input.value, dark: darkPicker.input.value }, 'tint set to custom');
        }
      });
      lightPicker.input.addEventListener('input', () => {
        sendTint({ light: lightPicker.input.value, dark: darkPicker.input.value }, 'tint updated');
      });
      darkPicker.input.addEventListener('input', () => {
        sendTint({ light: lightPicker.input.value, dark: darkPicker.input.value }, 'tint updated');
      });

      const tintHelp = document.createElement('div');
      tintHelp.className = 'field-help';
      tintHelp.textContent = 'Default defers to the app-wide primary tint (hooks/_assetCatalogColorPrimaryTint.js). Custom overrides just this one image.';

      tintBlock.append(tintLabel, tintToggle, pickerRow, tintHelp);
      return tintBlock;
    }

    function fileButton(label, help, onFile) {
      const wrapper = document.createElement('label');
      wrapper.className = 'file-btn';
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.textContent = label;
      if (help) btn.title = help;
      btn.addEventListener('click', () => input.click());
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = 'image/png';
      input.addEventListener('change', async () => {
        const file = input.files[0];
        input.value = '';
        if (!file) return;
        try {
          await onFile(file);
        } catch (err) {
          showToast('err', err.message);
        }
      });
      wrapper.append(btn, input);
      return wrapper;
    }

    // Quick-add candidates offered as ready-made badges — matches metro-config's default
    // resolver.assetResolutions ("1.5"/"2"/"3"/"4", "1" being the always-visible base). A project
    // with a customized resolver.assetResolutions (or a one-off custom asset) isn't limited to
    // these — see the "Add custom…" control in densityRow, and lib/asset-catalog-core.js's
    // module-level comment on why density is open-ended rather than a fixed enum everywhere else.
    const COMMON_DENSITIES = ['1.5', '2', '3', '4'];

    function isValidDensityInput(value) {
      return /^[0-9]+(\.[0-9]+)?$/.test(value) && Number(value) > 0;
    }

    function densitySlot(group, density) {
      return density === '1' ? group : `${group}@${density}x`;
    }

    /** One row per appearance (light/dark) — the base (1x) file's badge+Add/Replace(+Remove) is
     * always visible; every other density (the common 1.5/2/3/4 quick-add set, any custom density
     * already present, and an "Add custom…" control for one that isn't) lives inside a
     * `.density-variants` wrapper toggled by the global "Show density variants" checkbox — purely
     * visual, never affects what's actually on disk. No density is "the base" functionally — all
     * are equally optional/removable/independent (the generated catalog just always requires the
     * bare filename, see lib/asset-catalog-core.js's module comment). The only live guard here: for
     * the 'light' group, Remove is withheld on the last remaining file, since an image can never end
     * up with zero light-appearance files (nothing left to require). A 'dark' group has no such
     * guard — removing its last file just means the image has no dark appearance anymore, same as
     * never having had one. */
    function densityRow(entry, group) {
      const row = document.createElement('div');
      row.className = 'row density-row';
      const title = document.createElement('span');
      title.className = 'density-row-title';
      title.textContent = group === 'light' ? 'Light:' : 'Dark:';
      row.appendChild(title);

      const present = entry.densities[group]; // sorted array of density strings, e.g. ['1','1.5','4']
      const presentSet = new Set(present);

      function addBadgeAndControls(container, density) {
        const has = presentSet.has(density);
        const slot = densitySlot(group, density);
        const label = `${density}x`;

        const badge = document.createElement('span');
        badge.className = 'density-badge' + (has ? ' present' : '');
        badge.textContent = has ? label : `${label} —`;
        container.appendChild(badge);

        container.appendChild(fileButton(
          has ? 'Replace' : 'Add',
          `Upload the ${label} file for the ${group} appearance`,
          async (file) => {
            const base64 = await fileToBase64(file);
            const json = await api('PUT', `/api/images/${encodeURIComponent(entry.name)}`, { [slot]: base64 });
            applyResult(json);
            showToast('ok', `${entry.name}: ${group} ${label} ${has ? 'replaced' : 'added'}`);
          },
        ));

        if (has) {
          const isLastLight = group === 'light' && present.length === 1;
          const removeBtn = document.createElement('button');
          removeBtn.type = 'button';
          removeBtn.textContent = 'Remove';
          if (isLastLight) {
            removeBtn.disabled = true;
            removeBtn.title = `Can't remove — this is the image's only light-appearance file`;
          } else {
            removeBtn.title = `Delete the ${label} file for the ${group} appearance`;
            removeBtn.addEventListener('click', async () => {
              try {
                const json = await api('PUT', `/api/images/${encodeURIComponent(entry.name)}`, { [`remove:${slot}`]: true });
                applyResult(json);
                showToast('ok', `${entry.name}: ${group} ${label} removed`);
              } catch (err) {
                showToast('err', err.message);
              }
            });
          }
          container.appendChild(removeBtn);
        }
      }

      // Base (1x) — always visible, unaffected by the density-variants toggle.
      addBadgeAndControls(row, '1');

      const variants = document.createElement('span');
      variants.className = 'density-variants';
      variants.style.display = showDensityVariants ? '' : 'none';

      const shown = new Set();
      for (const density of COMMON_DENSITIES) {
        addBadgeAndControls(variants, density);
        shown.add(density);
      }
      // A custom density already on disk (e.g. from a project with its own metro.config.js
      // resolver.assetResolutions, or dropped in by hand) that isn't one of the common candidates
      // above — surface it too instead of silently hiding a real, working file.
      for (const density of present) {
        if (density !== '1' && !shown.has(density)) {
          addBadgeAndControls(variants, density);
          shown.add(density);
        }
      }

      const customWrap = document.createElement('span');
      customWrap.className = 'density-custom';
      const customInput = document.createElement('input');
      customInput.type = 'text';
      customInput.placeholder = 'e.g. 2.5';
      customInput.className = 'density-custom-input';
      customWrap.appendChild(customInput);
      customWrap.appendChild(fileButton(
        'Add custom…',
        'Add a density not offered as a quick button above — type a positive number (e.g. "2.5"), then choose a file',
        async (file) => {
          const density = customInput.value.trim();
          if (!isValidDensityInput(density)) {
            throw new Error('enter a positive number for the density, e.g. "2.5"');
          }
          const slot = densitySlot(group, density);
          const base64 = await fileToBase64(file);
          const json = await api('PUT', `/api/images/${encodeURIComponent(entry.name)}`, { [slot]: base64 });
          applyResult(json);
          customInput.value = '';
          showToast('ok', `${entry.name}: ${group} ${density}x added`);
        },
      ));
      variants.appendChild(customWrap);

      row.appendChild(variants);
      return row;
    }

    function renderNewDetail() {
      const wrap = document.createElement('div');

      const header = document.createElement('div');
      header.className = 'detail-header';
      const nameEl = document.createElement('div');
      nameEl.className = 'detail-name';
      nameEl.textContent = 'New Image';
      header.appendChild(nameEl);
      wrap.appendChild(header);

      const nameBlock = document.createElement('div');
      nameBlock.className = 'field-block';
      const nameLabel = document.createElement('label');
      nameLabel.textContent = 'Name — becomes assets/images/<name>/';
      const nameInput = document.createElement('input');
      nameInput.type = 'text';
      nameInput.placeholder = 'lowercase-with-hyphens';
      nameInput.title = 'Lowercase letters, digits, and hyphens only, e.g. "drawer-home"';
      nameBlock.append(nameLabel, nameInput);
      wrap.appendChild(nameBlock);

      const modeBlock = document.createElement('div');
      modeBlock.className = 'field-block';
      const modeLabel = document.createElement('label');
      modeLabel.textContent = 'Rendering mode';
      const modeSelect = document.createElement('select');
      for (const m of ['template', 'original']) {
        const opt = document.createElement('option');
        opt.value = m;
        opt.textContent = m;
        modeSelect.appendChild(opt);
      }
      const modeHelp = document.createElement('div');
      modeHelp.className = 'field-help';
      modeHelp.textContent = 'template = single-color tintable glyph. original = non-tintable multi-color art (e.g. a logo).';
      modeBlock.append(modeLabel, modeSelect, modeHelp);
      wrap.appendChild(modeBlock);

      // Slot key -> selected File — none individually required. Only constraint (matches the
      // server): at least one light-appearance slot must end up set.
      const files = {}; // e.g. "light", "light@2x", "dark@1.5x" -> File

      /** One optional-file-input per density for a light/dark appearance — mirrors densityRow's
       * per-slot shape so creating an image isn't a special case of managing one. The base (1x)
       * input is always visible; the common 1.5/2/3/4 set plus a custom-density input live inside
       * a `.density-variants` wrapper toggled by the same global "Show density variants" checkbox
       * the detail view uses. */
      function newFileFields(group, groupLabel, help) {
        const block = document.createElement('div');
        block.className = 'field-block';
        const label = document.createElement('label');
        label.textContent = groupLabel;
        block.appendChild(label);
        const row = document.createElement('div');
        row.className = 'row';

        function addInput(container, density) {
          const slot = densitySlot(group, density);
          const inputLabel = document.createElement('label');
          inputLabel.style.display = 'inline-flex';
          inputLabel.style.alignItems = 'center';
          inputLabel.style.gap = '4px';
          inputLabel.style.fontSize = '11px';
          inputLabel.style.color = 'var(--text-dim)';
          const span = document.createElement('span');
          span.textContent = `${density}x`;
          const input = document.createElement('input');
          input.type = 'file';
          input.accept = 'image/png';
          input.addEventListener('change', () => {
            files[slot] = input.files[0] || null;
            updateCreateBtnState();
          });
          inputLabel.append(span, input);
          container.appendChild(inputLabel);
        }

        addInput(row, '1'); // base — always visible, unaffected by the density-variants toggle

        const variants = document.createElement('span');
        variants.className = 'density-variants';
        variants.style.display = showDensityVariants ? '' : 'none';
        for (const density of COMMON_DENSITIES) addInput(variants, density);

        const customWrap = document.createElement('span');
        customWrap.className = 'density-custom';
        const customDensityInput = document.createElement('input');
        customDensityInput.type = 'text';
        customDensityInput.placeholder = 'e.g. 2.5';
        customDensityInput.className = 'density-custom-input';
        const customFileInput = document.createElement('input');
        customFileInput.type = 'file';
        customFileInput.accept = 'image/png';
        customFileInput.title = 'Add a density not offered as a quick input above — type a positive number to the left first (e.g. "2.5")';
        customFileInput.addEventListener('change', () => {
          const density = customDensityInput.value.trim();
          if (!isValidDensityInput(density)) {
            if (customFileInput.files[0]) showToast('err', 'enter a positive number for the density, e.g. "2.5"');
            customFileInput.value = '';
            return;
          }
          files[densitySlot(group, density)] = customFileInput.files[0] || null;
          updateCreateBtnState();
        });
        customWrap.append(customDensityInput, customFileInput);
        variants.appendChild(customWrap);

        row.appendChild(variants);
        block.appendChild(row);
        if (help) {
          const helpEl = document.createElement('div');
          helpEl.className = 'field-help';
          helpEl.textContent = help;
          block.appendChild(helpEl);
        }
        return block;
      }

      wrap.appendChild(newFileFields('light', 'Light appearance (at least one density required)'));
      wrap.appendChild(newFileFields(
        'dark',
        'Dark appearance (optional)',
        'Only meaningful for "original" — a "template" image is tinted instead, it never needs this.',
      ));

      const actionsBlock = document.createElement('div');
      actionsBlock.className = 'row';
      const createBtn = document.createElement('button');
      createBtn.className = 'create-btn';
      createBtn.type = 'button';
      createBtn.textContent = 'Create';

      // Disabled until the two real requirements are met, rather than clickable-then-toast — the
      // same "just make it unavailable" pattern densityRow uses for its own Remove button. Each
      // file input above already calls this directly on change (density is open-ended now, so
      // there's no fixed set of inputs to wire generically via a single querySelectorAll pass).
      function updateCreateBtnState() {
        const hasName = nameInput.value.trim().length > 0;
        const hasLight = Object.entries(files).some(([slot, file]) => file && (slot === 'light' || slot.startsWith('light@')));
        createBtn.disabled = !hasName || !hasLight;
        createBtn.title = !hasName
          ? 'Enter a name first'
          : !hasLight
            ? 'Needs at least one light image'
            : 'Writes assets/images/<name>/ immediately — undoable with Ctrl/Cmd+Z';
      }
      nameInput.addEventListener('input', updateCreateBtnState);
      updateCreateBtnState();

      createBtn.addEventListener('click', async () => {
        const name = nameInput.value.trim();
        try {
          const body = { name, mode: modeSelect.value };
          for (const [slot, file] of Object.entries(files)) {
            if (file) body[slot] = await fileToBase64(file);
          }
          const json = await api('POST', '/api/images', body);
          selectedImage = name;
          applyResult(json);
          showToast('ok', `${name}: created`);
        } catch (err) {
          showToast('err', err.message);
        }
      });
      const cancelBtn = document.createElement('button');
      cancelBtn.type = 'button';
      cancelBtn.textContent = 'Cancel';
      cancelBtn.addEventListener('click', () => {
        selectedImage = null;
        renderList();
        renderDetail();
      });
      actionsBlock.append(createBtn, cancelBtn);
      wrap.appendChild(actionsBlock);

      return wrap;
    }

    // ---------- colors detail pane ----------

    /** A color's detail view mirrors the image detail view's conventions exactly: two big swatch
     * previews (here showing the color itself, not an image rendered against a simulated app
     * background), every control live with no Save button, a Delete action, all wired through
     * PUT/DELETE /api/colors/:name. */
    function renderColorDetail(entry) {
      const wrap = document.createElement('div');

      const header = document.createElement('div');
      header.className = 'detail-header';
      const nameEl = document.createElement('div');
      nameEl.className = 'detail-name';
      nameEl.textContent = entry.name;
      header.appendChild(nameEl);
      wrap.appendChild(header);

      const swatches = document.createElement('div');
      swatches.className = 'swatches';

      const lightSwatch = document.createElement('div');
      lightSwatch.className = 'swatch';
      lightSwatch.style.background = entry.light;
      const lightLabel = document.createElement('div');
      lightLabel.className = 'swatch-label';
      lightLabel.textContent = 'light';
      lightSwatch.appendChild(lightLabel);
      swatches.appendChild(lightSwatch);

      const darkSwatch = document.createElement('div');
      darkSwatch.className = 'swatch';
      darkSwatch.style.background = entry.dark;
      const darkLabel = document.createElement('div');
      darkLabel.className = 'swatch-label';
      darkLabel.textContent = 'dark';
      darkSwatch.appendChild(darkLabel);
      swatches.appendChild(darkSwatch);

      wrap.appendChild(swatches);

      const lightBlock = document.createElement('div');
      lightBlock.className = 'field-block';
      const lightPickerLabel = document.createElement('label');
      lightPickerLabel.textContent = 'Light color';
      const lightInput = document.createElement('input');
      lightInput.type = 'color';
      lightInput.value = entry.light;
      lightInput.addEventListener('input', async () => {
        try {
          const json = await api('PUT', `/api/colors/${encodeURIComponent(entry.name)}`, { light: lightInput.value });
          applyResult(json);
          showToast('ok', `${entry.name}: light color updated`);
        } catch (err) {
          showToast('err', err.message);
        }
      });
      lightBlock.append(lightPickerLabel, lightInput);
      wrap.appendChild(lightBlock);

      const darkBlock = document.createElement('div');
      darkBlock.className = 'field-block';
      const darkToggleLabel = document.createElement('label');
      darkToggleLabel.textContent = 'Dark color';
      const darkToggle = document.createElement('select');
      darkToggle.title = 'Same as light = no override, falls back to the light color everywhere. Custom = a distinct dark-mode value.';
      for (const [value, label] of [['same', 'Same as light'], ['custom', 'Custom']]) {
        const opt = document.createElement('option');
        opt.value = value;
        opt.textContent = label;
        darkToggle.appendChild(opt);
      }
      // GET /api/colors always resolves `dark` to a real hex (defaulting to `light` when never
      // set server-side) — there's no separate flag distinguishing "explicitly set equal to
      // light" from "never set", so this infers the toggle's starting state from equality, same
      // as the server itself treats the two as indistinguishable once stored.
      const hasOverride = entry.dark !== entry.light;
      darkToggle.value = hasOverride ? 'custom' : 'same';

      const darkInput = document.createElement('input');
      darkInput.type = 'color';
      darkInput.value = entry.dark;
      darkInput.style.display = hasOverride ? '' : 'none';

      darkToggle.addEventListener('change', async () => {
        if (darkToggle.value === 'same') {
          darkInput.style.display = 'none';
          try {
            const json = await api('PUT', `/api/colors/${encodeURIComponent(entry.name)}`, { dark: null });
            applyResult(json);
            showToast('ok', `${entry.name}: dark cleared (same as light)`);
          } catch (err) {
            showToast('err', err.message);
          }
        } else {
          darkInput.style.display = '';
          darkInput.value = entry.light;
          try {
            const json = await api('PUT', `/api/colors/${encodeURIComponent(entry.name)}`, { dark: darkInput.value });
            applyResult(json);
            showToast('ok', `${entry.name}: dark color set`);
          } catch (err) {
            showToast('err', err.message);
          }
        }
      });
      darkInput.addEventListener('input', async () => {
        try {
          const json = await api('PUT', `/api/colors/${encodeURIComponent(entry.name)}`, { dark: darkInput.value });
          applyResult(json);
          showToast('ok', `${entry.name}: dark color updated`);
        } catch (err) {
          showToast('err', err.message);
        }
      });

      const darkHelp = document.createElement('div');
      darkHelp.className = 'field-help';
      darkHelp.textContent = 'Same as light = falls back to the light color everywhere. Custom = a distinct dark-mode value.';
      darkBlock.append(darkToggleLabel, darkToggle, darkInput, darkHelp);
      wrap.appendChild(darkBlock);

      wrap.appendChild(document.createElement('hr')).className = 'divider';

      const deleteBtn = document.createElement('button');
      deleteBtn.className = 'danger';
      deleteBtn.type = 'button';
      deleteBtn.textContent = 'Delete Color';
      deleteBtn.title = 'Remove this entire color entry (undoable — Ctrl/Cmd+Z or the Undo button)';
      deleteBtn.addEventListener('click', async () => {
        if (!confirm(`Delete assets/colors/${entry.name}/? You can Undo this right after.`)) return;
        try {
          const json = await api('DELETE', `/api/colors/${encodeURIComponent(entry.name)}`);
          selectedColor = null;
          applyResult(json);
          showToast('ok', `${entry.name}: deleted (Ctrl/Cmd+Z to undo)`);
        } catch (err) {
          showToast('err', err.message);
        }
      });
      wrap.appendChild(deleteBtn);

      return wrap;
    }

    function renderNewColorDetail() {
      const wrap = document.createElement('div');

      const header = document.createElement('div');
      header.className = 'detail-header';
      const nameEl = document.createElement('div');
      nameEl.className = 'detail-name';
      nameEl.textContent = 'New Color';
      header.appendChild(nameEl);
      wrap.appendChild(header);

      const nameBlock = document.createElement('div');
      nameBlock.className = 'field-block';
      const nameLabel = document.createElement('label');
      nameLabel.textContent = 'Name — becomes assets/colors/<name>/';
      const nameInput = document.createElement('input');
      nameInput.type = 'text';
      nameInput.placeholder = 'lowercase-with-hyphens';
      nameInput.title = 'Lowercase letters, digits, and hyphens only, e.g. "brand-primary"';
      nameBlock.append(nameLabel, nameInput);
      wrap.appendChild(nameBlock);

      const lightBlock = document.createElement('div');
      lightBlock.className = 'field-block';
      const lightLabel = document.createElement('label');
      lightLabel.textContent = 'Light color (required)';
      const lightInput = document.createElement('input');
      lightInput.type = 'color';
      lightInput.value = '#000000';
      lightBlock.append(lightLabel, lightInput);
      wrap.appendChild(lightBlock);

      const darkBlock = document.createElement('div');
      darkBlock.className = 'field-block';
      const darkToggleLabel = document.createElement('label');
      darkToggleLabel.textContent = 'Dark color';
      const darkToggle = document.createElement('select');
      for (const [value, label] of [['same', 'Same as light'], ['custom', 'Custom']]) {
        const opt = document.createElement('option');
        opt.value = value;
        opt.textContent = label;
        darkToggle.appendChild(opt);
      }
      const darkInput = document.createElement('input');
      darkInput.type = 'color';
      darkInput.value = '#ffffff';
      darkInput.style.display = 'none';
      darkToggle.addEventListener('change', () => {
        darkInput.style.display = darkToggle.value === 'custom' ? '' : 'none';
      });
      const darkHelp = document.createElement('div');
      darkHelp.className = 'field-help';
      darkHelp.textContent = 'Optional — defaults to "same as light" if left as-is.';
      darkBlock.append(darkToggleLabel, darkToggle, darkInput, darkHelp);
      wrap.appendChild(darkBlock);

      const actionsBlock = document.createElement('div');
      actionsBlock.className = 'row';
      const createBtn = document.createElement('button');
      createBtn.className = 'create-btn';
      createBtn.type = 'button';
      createBtn.textContent = 'Create';

      // Disabled until a name is entered, rather than clickable-then-toast — same pattern as the
      // image create button and densityRow's Remove button use.
      function updateCreateBtnState() {
        createBtn.disabled = nameInput.value.trim().length === 0;
        createBtn.title = createBtn.disabled
          ? 'Enter a name first'
          : 'Writes assets/colors/<name>/ immediately — undoable with Ctrl/Cmd+Z';
      }
      nameInput.addEventListener('input', updateCreateBtnState);
      updateCreateBtnState();

      createBtn.addEventListener('click', async () => {
        const name = nameInput.value.trim();
        try {
          const body = { name, light: lightInput.value };
          if (darkToggle.value === 'custom') body.dark = darkInput.value;
          const json = await api('POST', '/api/colors', body);
          selectedColor = name;
          applyResult(json);
          showToast('ok', `${name}: created`);
        } catch (err) {
          showToast('err', err.message);
        }
      });
      const cancelBtn = document.createElement('button');
      cancelBtn.type = 'button';
      cancelBtn.textContent = 'Cancel';
      cancelBtn.addEventListener('click', () => {
        selectedColor = null;
        renderList();
        renderDetail();
      });
      actionsBlock.append(createBtn, cancelBtn);
      wrap.appendChild(actionsBlock);

      return wrap;
    }

    // ---------- app-icon detail pane ----------

    function appIconSrc(platform, filename) {
      return `/app-icon-src/${platform}/${filename}?t=${Date.now()}`;
    }

    /** One platform's full editor: a fixed set of slot rows (per APP_ICON_SLOT_INFO), each an
     * independent droppable/uploadable/removable swatch — no "create" flow, since uploading a
     * platform's first slot implicitly creates its folder (mirrors handleAppIconUpload
     * server-side). `state` is undefined when the platform isn't configured at all, in which case
     * every slot just renders empty rather than the whole view being blocked on a create step. */
    function renderAppIconPlatformDetail(platform) {
      const wrap = document.createElement('div');
      const info = APP_ICON_SLOT_INFO[platform];
      const state = appIconPlatforms[platform];
      const configured = Boolean(state);

      const header = document.createElement('div');
      header.className = 'detail-header';
      const nameEl = document.createElement('div');
      nameEl.className = 'detail-name';
      nameEl.textContent = APP_ICON_PLATFORM_LABELS[platform];
      header.appendChild(nameEl);
      const badge = document.createElement('div');
      badge.className = 'badge';
      badge.textContent = configured ? 'configured' : 'not configured';
      badge.title = configured
        ? `assets/app-icon/${platform}/ exists`
        : `assets/app-icon/${platform}/ doesn't exist yet — upload a file below to create it`;
      header.appendChild(badge);
      wrap.appendChild(header);

      for (const slot of info.slots) {
        const filename = state ? state.slots[slot] : null;
        wrap.appendChild(renderAppIconSlotBlock(platform, slot, filename, info.help[slot]));
      }

      wrap.appendChild(document.createElement('hr')).className = 'divider';

      // ---- "set as app icon" (app.json wiring) + "sync to native project" (direct file copy) ----
      // Neither of these touches the assets/app-icon/ files themselves (those are already written
      // the moment a slot above is uploaded) — this section is about propagating what's already on
      // disk into app.json and, optionally, straight into the native ios/android project.
      const appJsonSection = document.createElement('div');
      appJsonSection.className = 'field-block';

      const appJsonTitle = document.createElement('label');
      appJsonTitle.textContent = 'App.json wiring';
      appJsonSection.appendChild(appJsonTitle);

      const primarySlot = platform === 'ios' ? 'light' : platform === 'android' ? 'foreground' : 'favicon';
      const primarySlotPresent = Boolean(state && state.slots[primarySlot]);

      const disclaimer = document.createElement('div');
      disclaimer.className = 'field-help';
      disclaimer.textContent = platform === 'web'
        ? 'Sets expo.web.favicon in app.json. The web build reads that file directly — no rebuild or native step needed afterwards.'
        : `Sets expo.${platform === 'ios' ? 'ios.icon' : 'android.adaptiveIcon'} in app.json to point at the file(s) above. A ` +
          'running app only picks this up after you either re-run `expo prebuild` (or a fresh native build), or press ' +
          '"Sync to native project" below to copy these files directly into the existing ios/android folders instead.';
      appJsonSection.appendChild(disclaimer);

      const setBtn = document.createElement('button');
      setBtn.type = 'button';
      setBtn.textContent = 'Set this icon as the app icon';
      setBtn.disabled = !primarySlotPresent;
      setBtn.title = primarySlotPresent
